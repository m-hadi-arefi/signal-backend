services:
  claude-gateway:
    build:
      context: ../services/claude
      dockerfile: Dockerfile
    container_name: claude-gateway
    volumes:
      - ../services/claude/app:/app
      - ${CLAUDE_HOME}:/root/.claude
    networks:
      - signal-net
    restart: unless-stopped
    cpus: "0.3"
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
