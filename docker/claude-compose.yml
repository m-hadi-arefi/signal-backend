services:
  claude-gateway:
    build:
      context: ./services/claude
      dockerfile: Dockerfile
    container_name: claude-gateway
    ports:
      - "8009:8000"
    volumes:
      - ./services/claude/app:/app
      - ${USERPROFILE}/.claude:/root/.claude
    networks:
      - event-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  event-net:
    external: true
