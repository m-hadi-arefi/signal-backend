services:

  office:
    build:
      context: .
      dockerfile: services/office/Dockerfile
    ports:
      - "5050:5000"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKER: kafka:9092
      FLASK_SECRET_KEY: "signal-admin-panel-secret-key-x9k2m7p4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - event-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ping')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  event-net:
    external: true
