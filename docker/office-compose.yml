services:
  office:
    build:
      context: ..
      dockerfile: services/office/Dockerfile
    ports:
      - "5050:5000"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - signal-net
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ping')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
