services:
  price-streamer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/processors/price_streamer/main.py
    env_file:
      - ../.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SKIP_KAFKA: "true"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - signal-net
    cpus: "0.2"
    mem_limit: 192m
    memswap_limit: 192m

  signal-evaluator:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/processors/signal_evaluator/main.py
    env_file:
      - ../.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SKIP_KAFKA: "true"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - signal-net
    cpus: "0.2"
    mem_limit: 192m
    memswap_limit: 192m
