services:
  telegram-producer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/producers/telegram/main.py
    env_file:
      - ../.env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      engine:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - signal-net
    cpus: "0.1"
    mem_limit: 128m
    memswap_limit: 128m

  scraper-producer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/producers/scraper/main.py
    env_file:
      - ../.env
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      kafka:
        condition: service_healthy
      engine:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - signal-net
    cpus: "0.2"
    mem_limit: 192m
    memswap_limit: 192m

  http-api-producer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/producers/http_api/main.py
    env_file:
      - ../.env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      engine:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - signal-net
    cpus: "0.1"
    mem_limit: 128m
    memswap_limit: 128m
