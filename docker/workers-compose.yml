services:
  engine:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/engine/main.py
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 5s
      timeout: 2s
      retries: 20
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - signal-net
    restart: unless-stopped
    cpus: "0.4"
    mem_limit: 256m
    memswap_limit: 256m

  ai-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/workers/ai_worker/main.py
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 5s
      timeout: 2s
      retries: 20
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - signal-net
    restart: unless-stopped
    cpus: "0.3"
    mem_limit: 256m
    memswap_limit: 256m

  final-store:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/workers/final_store/main.py
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 5s
      timeout: 2s
      retries: 20
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - signal-net
    restart: unless-stopped
    cpus: "0.1"
    mem_limit: 128m
    memswap_limit: 128m
