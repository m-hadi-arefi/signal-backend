<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Admin — ورود</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0f1117; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #1a1d23; border: 1px solid #2d3142; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; }
    .form-control { background: #0f1117; border-color: #2d3142; color: #e0e0e0; }
    .form-control:focus { background: #0f1117; border-color: #f0b429; color: #fff; box-shadow: 0 0 0 0.2rem rgba(240,180,41,0.15); }
    .form-label { color: #a0a8b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="bi bi-activity text-warning fs-1"></i>
      <h5 class="text-white mt-2 mb-0">Signal Admin</h5>
      <small class="text-secondary">پنل مدیریت سیگنال</small>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label">نام کاربری</label>
        <input type="text" name="username" class="form-control" placeholder="admin" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label">رمز عبور</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold">
        <i class="bi bi-box-arrow-in-right me-1"></i>ورود
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
